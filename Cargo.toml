# Prim's Rust workspace. `native` is the Godot extension (prim_native); the
# room daemon and its crates (prim-proto, room-core, prim-room, prim-voice) join
# here as they are written. Submodules under dependencies/ keep their own
# workspaces and are only used through path dependencies.
[workspace]
members = ["native", "tools/iroh-hello", "crates/room-core", "crates/prim-room", "crates/prim-voice", "crates/prim", "crates/prim-cowatch", "crates/prim-ui", "crates/prim-events", "crates/prim-client"]
exclude = ["dependencies"]
resolver = "2"

[workspace.dependencies]
iroh = "1.4.1"
iroh-base = "1.4.1"

[patch.crates-io]
# One vendored libopus (1.5.2, static) for desktop and aarch64.
audiopus_sys = { path = "dependencies/godot-network-audio/opus-sys" }

# Crypto in debug builds is ~300x slower; the room-core simulator tests need dependencies optimised.
[profile.dev.package."*"]
opt-level = 3
# Dependencies ship without debug info: shrinks target/ by gigabytes; their backtraces are rarely
# needed. Our own crates keep full debug info.
debug = false
