# Prim's Rust workspace. `native` is the Godot extension (prim_native); the
# room daemon and its crates (prim-proto, room-core, prim-room, prim-voice) join
# here as they are written. Submodules under dependencies/ keep their own
# workspaces and are only used through path dependencies.
[workspace]
members = ["native", "tools/iroh-hello", "crates/room-core", "crates/prim-room", "crates/prim-voice", "crates/prim"]
exclude = ["dependencies"]
resolver = "2"

[workspace.dependencies]
iroh = "1.4.1"
iroh-base = "1.4.1"

[patch.crates-io]
neteq = { git = "https://github.com/hiinaspace/videocall-rs.git", rev = "e854b5a85cfabd8bb550e510c5380a50b159145b" }

# Crypto in debug builds is ~300x slower; the room-core simulator tests need dependencies optimised.
[profile.dev.package."*"]
opt-level = 3
