[package]
name = "prim-room"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false
description = "Tokio driver, transports (iroh prim/1, in-memory) and local API socket for the prim room daemon"

[dependencies]
anyhow = "1"
bytes = "1"
data-encoding = "2"
getrandom = "0.4"
iroh.workspace = true
room-core = { path = "../room-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros", "net", "fs", "signal"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
