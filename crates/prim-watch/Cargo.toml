[package]
name = "prim-watch"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false
description = "prim watch: a standalone mpv player that cowatches through the room daemon (prim-cowatch over mpv's JSON IPC and room.sock)"

[dependencies]
anyhow = "1"
data-encoding = "2"
libc = "0.2"
prim-client = { path = "../prim-client" }
prim-cowatch = { path = "../prim-cowatch" }
prim-room = { path = "../prim-room" }
serde_json = "1"
