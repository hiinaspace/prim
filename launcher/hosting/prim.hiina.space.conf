server {
    listen 80;
    listen [::]:80;
    server_name prim.hiina.space;
    return 301 https://prim.hiina.space$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prim.hiina.space;
    root /mnt/nvme/prim;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/hiina.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiina.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Private-link distribution: discourage indexing, without adding a login.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $prim_cache_control always;
    location ~ /\. { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}

map $uri $prim_cache_control {
    default "no-cache";
    ~^/downloads/(linux|windows)/releases\..*\.signed\.json$ "no-store";
    ~^/downloads/(linux|windows)/Prim-[0-9].*\.nupkg$ "public, max-age=31536000, immutable";
}
